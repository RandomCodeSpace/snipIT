# OpenSSF Scorecard supply-chain analysis.
# Required by the security baseline. Best-effort target — no hard numeric floor; Scorecard does not gate merge.
# Docs: https://github.com/ossf/scorecard-action

name: Scorecard supply-chain security

on:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Restrict the default GITHUB_TOKEN to read-only; the steps below request the
# narrow scopes they actually need.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Required for upload to the code-scanning Security tab.
      security-events: write
      # Required to read OIDC token for publish_results.
      id-token: write
      # Default scopes for actions/checkout.
      contents: read
      actions: read

    steps:
      - name: Harden runner egress
        # step-security/harden-runner v2.19.0
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit

      - name: Checkout code
        # actions/checkout v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        # ossf/scorecard-action v2.4.3
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish the results so they appear on the public Scorecard dashboard.
          publish_results: true

      - name: Upload Scorecard SARIF (artifact)
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to GitHub code-scanning
        # github/codeql-action/upload-sarif v3.35.2
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          sarif_file: results.sarif
